name: resident_access
description: Barangay Biñang 2nd — Resident Portal (access request flow), Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/barangaylogo.webp
    - assets/sounds/
